name = "vultr-proxy-users"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "vultr-proxy-users"
database_id = "d06a9a46-2158-441b-acee-46c8a7053b16"

# 定时：每分钟收尾卡住的切换、同步 relay 流量、候选到期/用尽后停服务。不自动回收。
[triggers]
crons = ["* * * * *"]

# Durable Object：切换进度实时推送（WebSocket）
[[durable_objects.bindings]]
name = "SWITCH_ROOM"
class_name = "SwitchRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SwitchRoom"]
