name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x86-64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend deps
        run: npm install
        working-directory: client

      - name: Download sing-box sidecar (Windows x86-64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path client/src-tauri/binaries | Out-Null
          $zip = "$env:TEMP\sing-box-win.zip"
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-windows-amd64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\sing-box-win" -Force
          Copy-Item "$env:TEMP\sing-box-win\sing-box-1.14.2-windows-amd64\sing-box.exe" "client/src-tauri/binaries/sing-box-x86_64-pc-windows-msvc.exe" -Force
          Get-ChildItem client/src-tauri/binaries

      - name: Download xray sidecar (Windows x86-64)
        shell: pwsh
        run: |
          $zip = "$env:TEMP\xray-win.zip"
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v26.10.21/Xray-windows-64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\xray-win" -Force
          Copy-Item "$env:TEMP\xray-win\xray.exe" "client/src-tauri/binaries/xray-x86_64-pc-windows-msvc.exe" -Force
          Get-ChildItem client/src-tauri/binaries

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tagName: win-v__VERSION__
          releaseName: "代理客户端 Windows v__VERSION__"
          releaseDraft: false
          prerelease: false
