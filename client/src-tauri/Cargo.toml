[package]
name = "proxy-client"
version = "0.1.0"
description = "代理客户端"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinInet", "Win32_Foundation", "Win32_UI_HiDpi"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "s"
